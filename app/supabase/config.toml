project_id = "omnisight"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false  # disabled for deterministic capture-baseline startup (vector/studio sidecars not needed for tests)
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[functions.admin-users]
verify_jwt = false

[storage]
enabled = false

[analytics]
# disabled for deterministic capture-baseline startup (analytics + vector sidecars not needed for tests)
# see docs/ops-notes.md (commit de96ade) for diagnostic rationale
enabled = false

[inbucket]
# disabled; camaras e2e tests do not exercise email-OTP flows as of HEAD
enabled = false
