name: E2E Smoke (Supabase auth + RLS)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'scripts/run-e2e.sh'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

# Cancel any in-flight e2e run when a new PR commit lands; keeps CI fast.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Supabase auth + RLS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # Pin to the local CLI version (2.107.0) so cache keys stay stable.
      SUPABASE_CLI_VERSION: '2.107.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lint the workflow files first so YAML / action syntax errors surface as
      # PR annotations on a red ❌ check before any heavy work (Supabase,
      # npm, Playwright) runs. `reviewdog/action-actionlint@v1` installs
      # actionlint automatically and re-emits findings as inline review comments.
      - name: Lint workflows (actionlint)
        uses: reviewdog/action-actionlint@v1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Supabase CLI
        run: |
          set -e
          mkdir -p /usr/local/bin
          curl -fsSL \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin supabase
          supabase --version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Cache Supabase stack (branches dir + user-level cli cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.supabase
            supabase/.branches
          key: supabase-stack-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            supabase-stack-${{ runner.os }}-

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke test
        id: smoke
        run: npm run test:e2e:bash

      - name: Smoke test duration (for budgeting)
        if: always()
        run: |
          set -e
          echo "Workflow finished at $(date -u +%FT%TZ)"

      - name: Upload HTML report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces + videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            playwright-report/data/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
